<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .form-group input, .form-group select, .form-group button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .form-group input[type="text"] {
            flex: 1;
            min-width: 200px;
        }
        .form-group button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        .form-group button:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .actions button {
            padding: 6px 12px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-edit {
            background-color: #ffc107;
            color: #333;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
        }
        .btn-status {
            background-color: #17a2b8;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Todo Application</h1>

    <div class="form-group">
        <input type="hidden" id="taskId">
        <input type="text" id="taskTitle" placeholder="Task Title" required>
        <input type="text" id="taskDescription" placeholder="Description">
        <input type="date" id="taskDate">
        <input type="time" id="taskTime">
        <select id="taskStatus">
            <option value="NOT_COMPLETED">NOT COMPLETED</option>
            <option value="ONGOING">ONGOING</option>
            <option value="FINISHED">FINISHED</option>
            <option value="REJECTED">REJECTED</option>
        </select>
        <button id="saveTaskBtn" onclick="saveTask()">Save Task</button>
        <button id="clearBtn" onclick="clearForm()" style="background-color: #6c757d;">Clear</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="taskTableBody">
            <!-- Tasks will be populated here -->
        </tbody>
    </table>
</div>

<script>
    const API_URL = 'http://localhost:8081/api/tasks';

    document.addEventListener("DOMContentLoaded", fetchTasks);

    function fetchTasks() {
        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('taskTableBody');
                tbody.innerHTML = '';
                data.forEach(task => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${task.id}</td>
                        <td>${task.title}</td>
                        <td>${task.description || ''}</td>
                        <td>${task.taskDate || ''}</td>
                        <td>${task.taskTime || ''}</td>
                        <td>${task.status}</td>
                        <td class="actions">
                            <button class="btn-status" onclick="updateStatus(${task.id},
                             '${task.status}')
                            ">Toggle Status</button>
                            <button class="btn-edit" onclick="editTask(${task.id})">Edit</button>
                            <button class="btn-delete" onclick="deleteTask(${task.id})
                            ">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(error => console.error('Error fetching tasks:', error));
    }

    function saveTask() {
        const id = document.getElementById('taskId').value;
        const title = document.getElementById('taskTitle').value;
        const description = document.getElementById('taskDescription').value;
        const taskDate = document.getElementById('taskDate').value;
        const taskTime = document.getElementById('taskTime').value;
        const status = document.getElementById('taskStatus').value;

        if (!title) {
            alert("Title is required!");
            return;
        }

        let taskTimeFormatted = taskTime;
        if(taskTime && taskTime.split(":").length === 2) {
             taskTimeFormatted = taskTime + ":00";
        }

        const task = {
            title,
            description,
            taskDate: taskDate ? taskDate : null,
            taskTime: taskTimeFormatted ? taskTimeFormatted : null,
            status
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(task)
        })
        .then(response => {
            if (response.ok) {
                clearForm();
                fetchTasks();
            } else {
                alert("Error saving task");
            }
        })
        .catch(error => console.error('Error saving task:', error));
    }

    function editTask(id) {
        fetch(`${API_URL}/${id}`)
            .then(response => response.json())
            .then(task => {
                document.getElementById('taskId').value = task.id;
                document.getElementById('taskTitle').value = task.title;
                document.getElementById('taskDescription').value = task.description || '';
                document.getElementById('taskDate').value = task.taskDate || '';
                
                if (task.taskTime) {
                    document.getElementById('taskTime').value = task.taskTime.substring(0, 5);
                } else {
                    document.getElementById('taskTime').value = '';
                }
                
                document.getElementById('taskStatus').value = task.status;
                document.getElementById('saveTaskBtn').innerText = "Update Task";
            })
            .catch(error => console.error('Error fetching task for edit:', error));
    }

    function deleteTask(id) {
        if (confirm("Are you sure you want to delete this task?")) {
            fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    fetchTasks();
                } else {
                    alert("Error deleting task");
                }
            })
            .catch(error => console.error('Error deleting task:', error));
        }
    }

    function updateStatus(id, currentStatus) {
        let newStatus = 'FINISHED';
        if (currentStatus === 'NOT_COMPLETED') newStatus = 'ONGOING';
        else if (currentStatus === 'ONGOING') newStatus = 'FINISHED';
        else if (currentStatus === 'FINISHED') newStatus = 'NOT_COMPLETED';

        fetch(`${API_URL}/${id}/status?status=${newStatus}`, {
            method: 'PATCH'
        })
        .then(response => {
            if (response.ok) {
                fetchTasks();
            } else {
                alert("Error updating status");
            }
        })
        .catch(error => console.error('Error updating status:', error));
    }

    function clearForm() {
        document.getElementById('taskId').value = '';
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDescription').value = '';
        document.getElementById('taskDate').value = '';
        document.getElementById('taskTime').value = '';
        document.getElementById('taskStatus').value = 'NOT_COMPLETED';
        document.getElementById('saveTaskBtn').innerText = "Save Task";
    }
</script>

</body>
</html>
